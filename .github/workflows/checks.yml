# Pull-request checks use invented fixtures and fake object storage, with no production credentials.
name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline and status policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Status policy tests
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check this pull request updates status
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci/check_status_updated.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - name: Pipeline unit and publication failure tests
        run: python -m pytest -q pipeline/tests

  web:
    name: Web fixture build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      PT_DATA: fixtures
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install browser and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Build fixtures and lint
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Unit and browser tests (includes CSP assertions)
        run: npm test
