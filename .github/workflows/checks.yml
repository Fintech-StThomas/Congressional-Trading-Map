# Test proposed changes without credentials or generated production data.
name: Pull request checks

on:
  push:
    branches: ["claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One queue per event and branch: a newer push still cancels an older push run (and a newer PR update an older PR
# run), but a push run and the pull-request run for the same commit no longer cancel each other. A cancelled run of
# a required check left pull requests blocked although the other run of the same check had passed.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  status:
    name: Project status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test status checker
        run: python -m unittest scripts.ci.test_check_status
      - name: File line cap
        run: |
          python -m unittest scripts.ci.test_check_lines
          python scripts/ci/check_lines.py
      - name: Require STATUS.md for code changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci/check_status.py "$BASE_SHA" "$HEAD_SHA"
      - name: Require STATUS.md for working-branch code changes
        if: github.event_name == 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/ci/check_status.py "origin/$DEFAULT_BRANCH" HEAD

  pipeline:
    name: Pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24)
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q pipeline/tests
      - name: Operations scripts
        run: python -m pytest -q scripts/ops
      # The release Worker is plain JavaScript with no dependencies: the runner's own Node runs its tests.
      - name: Release Worker
        run: node --test worker/test

  web:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      PT_DATA: fixtures
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24)
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install browser and OS dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run build
      - run: npm run typecheck
      - name: Browser tests (includes CSP assertions)
        run: npm test
