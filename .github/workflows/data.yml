name: Daily data refresh

# Rebuilds the site data from the public sources and publishes it to Cloudflare R2 under data/, which the
# production site reads (DATA_BASE_URL). Nothing is committed: the generated tree is not stored in git.
# Order: unit tests -> pipeline (all stages, then validation) -> holdings validation -> publish to R2 -> verify that
# the public URL serves the new build time -> (opt-in, PT_PUBLISH_RELEASES=1) archive an immutable release. Any failure stops the job at that step (GitHub emails the owner).
# See pipeline/README.md ("Daily workflow", "Publishing to R2").

on:
  schedule:
    - cron: "41 7 * * *"   # 07:41 UTC daily, off the top of the hour
  workflow_dispatch:
    inputs:
      cache_only:
        description: "Rebuild from the restored download cache only (PT_CACHE_ONLY=1, no downloads), then validate and publish"
        type: boolean
        default: false

permissions:
  contents: read           # checkout only; the job commits and pushes nothing

concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: false  # never kill a run half-way through an upload; queue instead

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # No job-level env: every variable is set on the one step that needs it, so the tests and the pipeline run
    # under the same conditions on main as on any branch or fork.
    # GitHub Environment for the R2 secrets (docs/SECURITY-REVIEW.md, S6): once the owner has created the
    # `production` environment limited to main and moved the R2_* secrets into it, uncomment the next line.
    # environment: production
    steps:
      # Actions pinned to the commit of the tag in use (tag in the comment), so a moved tag cannot change the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false   # nothing is pushed

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24)
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # Downloads are reused across runs. Freshness does not depend on this cache: each source refetches on its own
      # schedule (legislators, SEC: daily; FEC: daily for the two latest cycles, weekly for older ones; Hugging Face
      # datasets are addressed by commit). A new key per run saves the refreshed cache; restore takes the latest.
      # The pipeline needs no previous build: it starts from this cache and an empty web/public/data.
      - name: Restore download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Unit tests
        timeout-minutes: 10
        run: python -m pytest -q pipeline/tests

      # Exits non-zero when any stage fails or validation finds a failure; every later step is then skipped, so a
      # build that failed validation is never published. Secrets are passed to this step only and never printed.
      - name: Run pipeline (all stages, then validation)
        timeout-minutes: 120
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}       # used only when PT_ENABLE_LDA=1 (off)
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PT_CACHE_ONLY: ${{ inputs.cache_only && '1' || '' }}
        run: python -m pipeline.run

      - name: Validate holdings
        timeout-minutes: 10
        run: python -m pipeline.holdings.validate --no-pdf

      # Runs only when every step above succeeded (the default). The R2 secrets are passed to this step only; the
      # script never prints them. Changed files only, meta.json and data/_manifest.json last, stale objects deleted
      # after every upload succeeded; then <R2_PUBLIC_URL>/data/meta.json is fetched and its build time compared
      # with the local one (--verify), so a run that did not reach the public URL fails here.
      - name: Publish to R2 and verify the public URL
        # Branch dispatches verify builds without writing production data, even while R2 secrets are still
        # repository-scoped. PT_R2_REQUIRED only makes missing credentials fail; it is not an upload gate.
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.repository.fork
        timeout-minutes: 30
        env:
          # On the default branch of the main repository publishing is the job's purpose, so missing R2 secrets
          # fail this step (exit 2) instead of skipping it. Elsewhere (forks, other branches) the upload skips.
          # Step-level on purpose: a job-level value leaked into the unit tests on main (run 43761542434).
          PT_R2_REQUIRED: ${{ (github.ref_name == github.event.repository.default_branch && !github.event.repository.fork) && '1' || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python -m pipeline.publish_r2 --verify

      # Opt-in immutable archive (docs/RELEASE-OPERATIONS.md). Off unless the repository variable PT_PUBLISH_RELEASES
      # is exactly 1, and only on the default branch of the main repository. It runs after the legacy publish above,
      # which stays the production path and is unchanged. It stages releases/<id>/, verifies every object, then moves
      # releases/current.json and records releases/index.json. Nothing here deletes objects. The R2 secrets are
      # passed to this step only.
      - name: Archive immutable release
        if: >-
          vars.PT_PUBLISH_RELEASES == '1'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && !github.event.repository.fork
        timeout-minutes: 30
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m pipeline.publish_release --dir web/public/data --activate

      - name: Report failure
        if: failure()
        run: |
          msg="Daily data refresh failed at the step marked failed above. A failure before the publish step uploads nothing; a failed upload there leaves meta.json (the switch) on the previous build. If the failed step is 'Archive immutable release', the legacy data/ publish already succeeded and the site is unaffected; read the step log: it says whether releases/current.json was moved, and re-running the step is safe."
          echo "::error::$msg"
          echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
